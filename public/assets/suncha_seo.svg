<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <filter id="ink-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" />
    </filter>
    <filter id="brush-blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141312" />
      <stop offset="100%" stop-color="#24211E" />
    </linearGradient>
  </defs>

  <!-- Dark charcoal canvas background resembling aged dark felt/board -->
  <rect width="600" height="600" fill="url(#bg-grad)" />

  <!-- Abstract organic Korean traditional pattern circles (red and purple) -->
  <g filter="url(#ink-blur)">
    <!-- Purple circular accents -->
    <circle cx="150" cy="120" r="45" fill="#5E35B1" opacity="0.35" />
    <circle cx="450" cy="120" r="45" fill="#5E35B1" opacity="0.35" />
    <circle cx="150" cy="480" r="45" fill="#5E35B1" opacity="0.35" />
    <circle cx="450" cy="480" r="45" fill="#5E35B1" opacity="0.35" />
    <circle cx="300" cy="300" r="70" fill="#5E35B1" opacity="0.25" />
    
    <!-- Red circular accents -->
    <circle cx="300" cy="100" r="35" fill="#C62828" opacity="0.4" />
    <circle cx="100" cy="300" r="35" fill="#C62828" opacity="0.4" />
    <circle cx="500" cy="300" r="35" fill="#C62828" opacity="0.4" />
    <circle cx="300" cy="500" r="35" fill="#C62828" opacity="0.4" />
    <circle cx="210" cy="210" r="35" fill="#C62828" opacity="0.35" />
    <circle cx="390" cy="210" r="35" fill="#C62828" opacity="0.35" />
    <circle cx="210" cy="390" r="35" fill="#C62828" opacity="0.35" />
    <circle cx="390" cy="390" r="35" fill="#C62828" opacity="0.35" />
  </g>

  <!-- Traditional trigram line-details in the background (faintly visible) -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.12" fill="none">
    <!-- Top (Geon) -->
    <line x1="270" y1="40" x2="330" y2="40" />
    <line x1="270" y1="50" x2="330" y2="50" />
    <line x1="270" y1="60" x2="330" y2="60" />
    <!-- Bottom (Gon) -->
    <line x1="270" y1="540" x2="295" y2="540" /><line x1="305" y1="540" x2="330" y2="540" />
    <line x1="270" y1="550" x2="295" y2="550" /><line x1="305" y1="550" x2="330" y2="550" />
    <line x1="270" y1="560" x2="295" y2="560" /><line x1="305" y1="560" x2="330" y2="560" />
  </g>

  <!-- Dynamic white cursive calligraphy brush lines on the Left -->
  <g stroke="#F5F5F0" fill="none" stroke-linecap="round">
    <path d="M 120 70 C 130 110, 80 180, 110 240 C 130 280, 150 320, 100 370 C 80 390, 140 450, 110 500" stroke-width="8" opacity="0.85" />
    <path d="M 70 120 Q 140 210, 90 320 T 130 450" stroke-width="4" opacity="0.7" />
    <path d="M 40 180 C 60 220, 30 290, 50 360 C 70 420, 40 460, 60 520" stroke-width="6" opacity="0.75" />
  </g>

  <!-- Dynamic white cursive calligraphy brush lines on the Right -->
  <g stroke="#F5F5F0" fill="none" stroke-linecap="round">
    <path d="M 480 80 C 470 130, 520 200, 490 270 C 470 320, 460 380, 510 430 C 530 450, 480 490, 500 530" stroke-width="7" opacity="0.85" />
    <path d="M 530 140 Q 460 240, 510 350 T 470 480" stroke-width="4" opacity="0.7" />
    <path d="M 560 190 C 540 230, 570 300, 550 370 C 530 430, 550 470, 530 520" stroke-width="5" opacity="0.75" stroke-dasharray="300, 10" />
  </g>

  <!-- Elegant green calligraphy brushwork in the direct Center (representing Mind-Matter Philosophy) -->
  <g stroke="#2E7D32" fill="none" stroke-linecap="round">
    <!-- Center glyph: organic brush path with variable widths -->
    <path d="M 300 170 C 270 210, 340 240, 270 290 C 250 310, 330 350, 320 380 C 310 410, 280 430, 300 450" stroke-width="14" stroke-linejoin="round" />
    <path d="M 290 190 Q 320 230, 285 280 T 315 390" stroke-width="8" stroke-linejoin="round" opacity="0.9" />
    <path d="M 315 160 C 330 200, 260 260, 340 310" stroke-width="6" opacity="0.85" />
    <path d="M 270 420 Q 330 430, 300 460" stroke-width="11" opacity="0.95" />
  </g>

  <!-- Overlay a subtle vignetting effect around the borders -->
  <rect width="600" height="600" fill="none" stroke="#0e0d0c" stroke-width="30" opacity="0.4" />
</svg>
