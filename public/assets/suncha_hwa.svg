<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Aged fine paper background with soft cream/off-white tone -->
  <rect width="600" height="600" fill="#FAF8F4" />

  <!-- Background paper subtle noise/texture representing traditional Hanji -->
  <rect width="600" height="600" fill="none" stroke="#e3dfd5" stroke-width="2" opacity="0.5" />

  <!-- Traditional Korean Orchid Leaves (수묵 난초 잎) in black ink wash style -->
  <g fill="none" stroke-linecap="round">
    <!-- Left sweeping leaf -->
    <path d="M 330 520 C 310 420, 200 250, 40 100" stroke="#1C1A17" stroke-width="5" opacity="0.9" />
    <path d="M 328 520 C 312 423, 204 254, 44 102" stroke="#2B2824" stroke-width="2" opacity="0.75" />

    <!-- Center vertical leaf -->
    <path d="M 332 520 C 340 380, 310 200, 380 50" stroke="#1C1A17" stroke-width="4.5" opacity="0.9" />
    <path d="M 330 520 C 338 382, 308 202, 378 52" stroke="#2B2824" stroke-width="2" opacity="0.8" />

    <!-- Right minor balancing leaf -->
    <path d="M 334 520 C 350 450, 420 380, 460 310" stroke="#2B2824" stroke-width="3" opacity="0.7" />
    <!-- Short leaf -->
    <path d="M 326 520 C 290 470, 250 420, 230 380" stroke="#3A3632" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Orchid Flowers (난초 꽃) in light elegant purple/lavender tones -->
  <!-- Flower 1: Higher and to the left -->
  <g transform="translate(300, 240)">
    <!-- Thin green-purple stem -->
    <path d="M 30 200 Q -10 100, -25 30" fill="none" stroke="#6D4C41" stroke-width="2" opacity="0.6" />
    
    <!-- Flower Petals (soft ink-like blobs) -->
    <g fill="#7E57C2" opacity="0.8" stroke="none">
      <path d="M -25 30 C -45 10, -50 0, -45 -10 C -40 -20, -30 -15, -25 5 Z" /> <!-- Petal Left -->
      <path d="M -25 30 C -5 15, 15 10, 20 20 C 25 30, 0 35, -15 32 Z" />    <!-- Petal Right -->
      <path d="M -25 30 C -25 0, -20 -20, -10 -25 C 0 -30, -5 -10, -15 10 Z" />   <!-- Petal Top -->
      <path d="M -25 30 C -40 40, -45 55, -35 60 C -25 65, -20 50, -22 35 Z" />  <!-- Petal Down-left -->
    </g>
    <!-- Dark deep purple flower core -->
    <path d="M -25 28 C -32 20, -28 15, -20 22 C -15 28, -22 32, -25 28 Z" fill="#4A148C" opacity="0.9" />
    <circle cx="-23" cy="24" r="3" fill="#FFEE58" /> <!-- Flower pistil yellow dot -->
  </g>

  <!-- Flower 2: Lower and to the right -->
  <g transform="translate(350, 290)">
    <!-- Thin stem -->
    <path d="M 0 100 Q 15 50, 10 0" fill="none" stroke="#6D4C41" stroke-width="1.8" opacity="0.6" />
    
    <!-- Flower Petals -->
    <g fill="#9575CD" opacity="0.85" stroke="none">
      <path d="M 10 0 C -10 -20, -15 -35, -5 -40 C 5 -45, 10 -25, 8 -10 Z" />
      <path d="M 10 0 C 30 -10, 45 -5, 48 5 C 51 15, 30 18, 15 10 Z" />
      <path d="M 10 0 C 15 20, 25 35, 18 40 C 11 45, 5 30, 8 10 Z" />
      <path d="M 10 0 C -10 10, -20 5, -22 -5 C -24 -15, -5 -10, 5 -2 Z" />
    </g>
    <!-- Deep purple core -->
    <path d="M 10 -2 C 3 -8, 8 -15, 15 -8 C 22 -1, 15 5, 10 -2 Z" fill="#4A148C" opacity="0.9" />
    <circle cx="11" cy="-5" r="2.5" fill="#FFEE58" />
  </g>

  <!-- Traditional Red Artist Seal Stamp (낙관) in the lower left corner -->
  <g transform="translate(45, 500)">
    <!-- Square Red Seal Outer -->
    <rect width="45" height="45" fill="#C62828" rx="2" />
    <!-- White simulated ancient seal characters (물파 / 불한) -->
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none">
      <!-- Top Left column -->
      <path d="M 12 10 L 12 22 M 12 16 L 20 16" />
      <path d="M 12 25 L 20 25 M 16 25 L 16 35" />
      <!-- Top Right column -->
      <path d="M 28 10 L 34 10 M 31 10 L 31 22 M 28 22 L 34 22" />
      <circle cx="31" cy="30" r="5" stroke-width="2" />
    </g>
  </g>
</svg>
