<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Smooth cream vertical silk wall mounting background -->
  <rect width="600" height="600" fill="#FAF7F2" />

  <!-- The Hanging Scroll (족자) Structure -->
  <!-- Outer Silk Mount Border (Pale beige/tan) -->
  <rect x="180" y="30" width="240" height="540" fill="#EADCC9" stroke="#DFCFB9" stroke-width="2" />
  
  <!-- Inner White/Parchment Paper Core -->
  <rect x="200" y="60" width="200" height="480" fill="#FCFAF5" stroke="#DFDBCF" stroke-width="1" />

  <!-- Upper Scroll Hanging String & Wooden Rod End -->
  <path d="M 300 12 L 200 30 M 300 12 L 400 30" fill="none" stroke="#8D6E63" stroke-width="2" />
  <circle cx="300" cy="12" r="4" fill="#5D4037" />
  
  <!-- Lower Scroll Roller Rod Ends (Wooden knobs projecting at the bottom) -->
  <rect x="165" y="563" width="15" height="14" fill="#4E342E" rx="2" />
  <rect x="420" y="563" width="15" height="14" fill="#4E342E" rx="2" />
  <!-- Lower rod -->
  <rect x="180" y="565" width="240" height="10" fill="#5D4037" />

  <!-- Master Calligraphy "寒茶" (Han Cha) written vertically inside the scroll -->
  <g fill="#1F1D1A" stroke="#1F1D1A" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- CHARACTER 1: 寒 (Han - meaning Cold/Chilly but spiritually alert) -->
    <g transform="translate(255, 110)">
      <!-- Top Dot/Stroke -->
      <path d="M 45 10 Q 42 16, 40 22" stroke-width="5" />
      <!-- Roof (宀) -->
      <path d="M 18 28 C 30 25, 60 23, 72 26 L 70 33" stroke-width="4.5" fill="none" />
      <path d="M 18 26 L 16 35" stroke-width="4" />
      <!-- Inside upper elements (H-like structures and horizontal strokes) -->
      <path d="M 28 42 L 62 42" stroke-width="4.5" />
      <path d="M 24 53 L 66 51" stroke-width="4" />
      <path d="M 35 40 L 35 52" stroke-width="4" />
      <path d="M 55 40 L 55 52" stroke-width="4" />
      <!-- Middle parts (stretching horizontal stroke) -->
      <path d="M 15 64 C 35 62, 55 61, 75 62" stroke-width="5" fill="none" />
      <path d="M 36 64 L 25 78" stroke-width="4" />
      <path d="M 54 64 L 65 78" stroke-width="4" />
      <!-- Two horizontal strokes inside -->
      <path d="M 33 72 L 57 72" stroke-width="3.5" />
      <path d="M 32 80 L 58 80" stroke-width="3.5" />
      <!-- Bottom strokes (Ice radical / two dots) -->
      <path d="M 30 96 Q 26 102, 22 108" stroke-width="5.5" />
      <path d="M 48 94 Q 52 100, 56 106" stroke-width="5.5" />
      <!-- Left-down sweeping stroke -->
      <path d="M 40 80 Q 25 98, 12 110" stroke-width="4.5" fill="none" />
      <!-- Right-down sweeping stroke -->
      <path d="M 50 80 Q 62 96, 78 108" stroke-width="5.5" fill="none" />
    </g>

    <!-- CHARACTER 2: 茶 (Cha - meaning Tea) -->
    <g transform="translate(255, 290)">
      <!-- Grass Radical (艹) at the top -->
      <path d="M 20 22 C 35 21, 55 19, 70 21" stroke-width="5" fill="none" />
      <path d="M 32 12 Q 33 22, 35 28" stroke-width="4.5" />
      <path d="M 58 11 Q 56 21, 53 27" stroke-width="4.5" />
      
      <!-- Roof (人) stretching across -->
      <path d="M 45 32 C 35 40, 24 55, 10 68" stroke-width="5" fill="none" />
      <path d="M 45 32 C 55 40, 68 56, 82 66" stroke-width="6" fill="none" />
      
      <!-- Center vertical pillar (木 stem) -->
      <path d="M 46 54 L 46 112" stroke-width="5.5" />
      
      <!-- Inside Horizontal bar -->
      <path d="M 28 72 C 38 71, 52 70, 62 71" stroke-width="4.5" fill="none" />
      
      <!-- Left and Right hooks/dashes at the bottom -->
      <path d="M 40 85 Q 26 95, 15 102" stroke-width="5" fill="none" />
      <path d="M 52 85 Q 65 96, 76 103" stroke-width="5.5" fill="none" />
    </g>
  </g>

  <!-- Red Seal Stamp (낙관) certifying the artwork -->
  <g transform="translate(340, 470)">
    <rect width="25" height="25" fill="#C62828" rx="1" />
    <!-- White seal markings -->
    <g stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none">
      <path d="M 6 5 L 6 13 M 6 9 L 12 9" />
      <path d="M 6 15 L 12 15 M 9 15 L 9 20" />
      <path d="M 18 5 L 18 20 M 14 12 L 20 12" />
    </g>
  </g>
</svg>
